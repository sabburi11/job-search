[project]
name = "job_search"
version = "0.1.0"
description = "job_search using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
    "gradio>=6.20.0",
    "gradio-pdf>=0.0.24",
    "pydantic>=2.12.5",
    "pypdf>=6.14.2",
]

[project.scripts]
job_search = "job_search.main:run"
run_crew = "job_search.main:run"
train = "job_search.main:train"
replay = "job_search.main:replay"
test = "job_search.main:test"
run_with_trigger = "job_search.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
